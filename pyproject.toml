[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devmcp-context"
version = "0.2.0"
authors = [
    {name = "Kushal", email = "work.kusal@gmail.com"},
]
description = "Structured AI memory layer - single source of truth for what your agent knows :)"
readme = { file = "README.md", content-type = "text/markdown" }
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = [
    "mcp", "memory", "agent", "llm", "ai", "context",
    "markdown", "persistence", "fastmcp", "claude", "opencode", "cursor",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://kushal1o1.github.io/devmcp-context/"
Repository = "https://github.com/kushal1o1/devmcp-context"
Issues = "https://github.com/kushal1o1/devmcp-context/issues"
Documentation = "https://kushal1o1.github.io/devmcp-context/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
devmcp-context = "devmcp_context.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devmcp_context"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["devmcp_context"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"